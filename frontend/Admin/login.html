<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sri Lankan Cuisine</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS (Referencing Client styles) -->
    <link rel="stylesheet" href="../Client/css/theme.css">
    <link rel="stylesheet" href="../Client/css/common.css">
    <link rel="stylesheet" href="login.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login-card animate-on-scroll">
        <div class="login-header">
            <i class="bi bi-shield-lock-fill login-logo"></i>
            <h2 class="fw-bold mb-1">Admin Access</h2>
            <p class="text-secondary small">Enter your credentials to manage content.</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="alertMessage">Invalid username or password</span>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required autofocus>
                <label for="username">Username</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">Password</label>
                <button type="button" id="togglePassword"
                    class="btn btn-sm btn-link text-secondary position-absolute top-50 end-0 translate-middle-y me-2 text-decoration-none">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-login w-100 rounded-pill shadow-sm">
                Sign In <i class="bi bi-box-arrow-in-right ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary">
            <a href="../Client/home.html" class="back-link">
                <i class="bi bi-arrow-left me-1"></i> Back to Website
            </a>

            <button id="darkModeToggle" class="btn btn-theme-toggle rounded-circle social-icon-btn d-block mx-auto mt-3"
                title="Toggle dark mode">
                <i class="bi bi-moon-fill"></i>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Client/js/config.js"></script>
    <script src="../Client/js/api.js"></script>
    <script src="../Client/js/theme.js"></script>
    <script src="login.js"></script>
</body>

</html>
