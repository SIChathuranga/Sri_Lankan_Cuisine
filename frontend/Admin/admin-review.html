<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Moderation - Sri Lankan Cuisine</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../Client/css/theme.css">
    <link rel="stylesheet" href="../Client/css/common.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="admin-review.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Sidebar (Same as admin.html) -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="admin.html" class="sidebar-logo text-gradient fw-bold">
                <i class="bi bi-gear-wide-connected"></i> Admin Panel
            </a>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="admin.html">
                    <i class="bi bi-grid-fill"></i> Food Management
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="admin-review.html">
                    <i class="bi bi-chat-dots-fill"></i> Reviews
                </a>
            </li>
            <li class="nav-item mt-auto pt-4 border-top border-secondary">
                <a class="nav-link text-danger" href="#" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </li>
        </ul>
        <div class="mt-4 pt-3 border-top border-secondary opacity-0">
            <!-- Spacer instead of button -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
        <!-- Mobile Toggle -->
        <button class="btn btn-primary d-lg-none mb-3 mobile-nav-toggle" type="button" data-bs-toggle="collapse"
            data-bs-target="#sidebar">
            <i class="bi bi-list"></i> Menu
        </button>

        <div class="container-fluid">
            <!-- Header -->
            <div class="page-header d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">Comment Moderation</h2>
                    <p class="text-secondary mb-0">Review, approve, or reject user comments.</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button id="darkModeToggle"
                        class="btn btn-theme-toggle rounded-circle social-icon-btn bg-body shadow-sm"
                        title="Toggle dark mode">
                        <i class="bi bi-moon-fill"></i>
                    </button>
                </div>
            </div>

            <!-- Stats Overview -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon bg-opacity-10 bg-warning text-warning">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="pendingCount">0</h3>
                            <p>Pending</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon bg-opacity-10 bg-success text-success">
                            <i class="bi bi-check-circle-fill"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="approvedCount">0</h3>
                            <p>Approved</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon bg-opacity-10 bg-danger text-danger">
                            <i class="bi bi-x-circle-fill"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="rejectedCount">0</h3>
                            <p>Rejected</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" data-status="">All</button>
                <button class="filter-tab" data-status="pending">Pending</button>
                <button class="filter-tab" data-status="approved">Approved</button>
                <button class="filter-tab" data-status="rejected">Rejected</button>
            </div>

            <!-- Comments List -->
            <div id="commentsContainer" class="row">
                <!-- Javascript will populate comments here -->
            </div>

            <!-- Pagination -->
            <nav class="mt-4 d-flex justify-content-center">
                <ul id="pagination" class="pagination">
                    <!-- Dynamic Pagination -->
                </ul>
            </nav>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Client/js/config.js"></script>
    <script src="../Client/js/api.js"></script>
    <script src="../Client/js/theme.js"></script>
    <script src="admin-review.js"></script>
</body>

</html>
