<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sri Lankan Cuisine</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../Client/css/theme.css">
    <link rel="stylesheet" href="../Client/css/common.css">
    <link rel="stylesheet" href="../Client/css/components.css">
    <link rel="stylesheet" href="admin.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo text-gradient fw-bold">
                <i class="bi bi-gear-wide-connected"></i> Admin Panel
            </a>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-page="foods">
                    <i class="bi bi-grid-fill"></i> Food Management
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="admin-review.html">
                    <i class="bi bi-chat-dots-fill"></i> Reviews
                </a>
            </li>
            <li class="nav-item mt-auto pt-4 border-top border-secondary">
                <a class="nav-link text-danger" href="#" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </li>
        </ul>
        <div class="mt-4 pt-3 border-top border-secondary opacity-0">
            <!-- Spacer instead of button -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
        <!-- Mobile Toggle -->
        <button class="btn btn-primary d-lg-none mb-3 mobile-nav-toggle" type="button" data-bs-toggle="collapse"
            data-bs-target="#sidebar">
            <i class="bi bi-list"></i> Menu
        </button>

        <div class="container-fluid">
            <!-- Header -->
            <div class="page-header d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">Food Management</h2>
                    <p class="text-secondary mb-0">Add, edit, or remove food items.</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button id="darkModeToggle"
                        class="btn btn-theme-toggle rounded-circle social-icon-btn bg-body shadow-sm"
                        title="Toggle dark mode">
                        <i class="bi bi-moon-fill"></i>
                    </button>
                    <button class="btn btn-primary rounded-pill px-4 shadow-sm" data-bs-toggle="modal"
                        data-bs-target="#foodModal" id="addFoodBtn">
                        <i class="bi bi-plus-lg me-2"></i> Add New Food
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-icon bg-opacity-10 bg-primary text-primary">
                            <i class="bi bi-collection"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalFoods">0</h3>
                            <p>Total Recipes</p>
                        </div>
                    </div>
                </div>
                <!-- Additional stats can be added here -->
            </div>

            <!-- Data Table -->
            <div class="data-table-container">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th style="width: 80px;">Image</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Date Added</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="foodTableBody">
                            <!-- Javascript will populate rows here -->
                        </tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <nav class="p-3 border-top border-light d-flex justify-content-center">
                    <ul id="pagination" class="pagination mb-0">
                        <!-- Dynamic Pagination -->
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Food Modal (Add/Edit) -->
    <div class="modal fade" id="foodModal" tabindex="-1" aria-labelledby="foodModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-bottom border-light">
                    <h5 class="modal-title fw-bold" id="foodModalLabel">Add New Food</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="foodForm">
                        <input type="hidden" id="foodId">

                        <!-- Image Upload -->
                        <div class="mb-4 text-center">
                            <div class="image-preview mx-auto" id="imagePreviewContainer"
                                style="max-width: 400px; height: 250px;">
                                <img id="imagePreview" src="" alt="Preview"
                                    class="d-none w-100 h-100 object-fit-cover rounded">
                                <span id="uploadPlaceholder"
                                    class="text-muted d-flex flex-column align-items-center justify-content-center h-100 w-100">
                                    <i class="bi bi-cloud-upload display-4 mb-2"></i>
                                    Click to upload image
                                </span>
                                <input type="file" id="foodImage"
                                    class="position-absolute top-0 start-0 w-100 h-100 opacity-0 cursor-pointer"
                                    accept="image/*">
                            </div>
                            <small class="text-muted">Supported formats: JPG, PNG, WEBP (Max 5MB)</small>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="foodTitle" class="form-label fw-bold">Title</label>
                                <input type="text" class="form-control" id="foodTitle" required
                                    placeholder="Ex: Chicken Curry">
                            </div>
                            <div class="col-md-4">
                                <label for="foodCategory" class="form-label fw-bold">Category</label>
                                <select class="form-select" id="foodCategory">
                                    <option value="Traditional" selected>Traditional</option>
                                    <option value="Street Food">Street Food</option>
                                    <option value="Dessert">Dessert</option>
                                    <option value="Beverage">Beverage</option>
                                    <option value="Spices">Spices</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="foodDescription" class="form-label fw-bold">Description</label>
                                <textarea class="form-control" id="foodDescription" rows="3" required
                                    placeholder="Short description..."></textarea>
                            </div>
                            <div class="col-12">
                                <label for="foodInstructions" class="form-label fw-bold">Details / Instructions</label>
                                <textarea class="form-control" id="foodInstructions" rows="5"
                                    placeholder="Detailed recipe instructions..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-light">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveFoodBtn">Save Food</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Client/js/config.js"></script>
    <script src="../Client/js/api.js"></script>
    <script src="../Client/js/theme.js"></script>
    <script src="admin.js"></script>
</body>

</html>
